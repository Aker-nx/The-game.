<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xhtml="http://www.w3.org/1999/xhtml"
     width="100%" height="100%" viewBox="0 0 1280 720"
     preserveAspectRatio="none">
  <title>The Game</title>
  <desc>Loads the browser game from jsDelivr.</desc>
  <rect width="1280" height="720" fill="#111827"/>
  <foreignObject x="0" y="0" width="1280" height="720">
    <xhtml:div xmlns="http://www.w3.org/1999/xhtml"
               style="width:100vw;height:100vh;margin:0;padding:0;overflow:hidden;background:#111827">
      <xhtml:iframe
        src="https://cdn.jsdelivr.net/gh/Aker-nx/The-game.@main/index.html"
        title="The Game"
        style="display:block;width:100%;height:100%;border:0"
        allow="fullscreen; gamepad"
        referrerpolicy="no-referrer"></xhtml:iframe>
    </xhtml:div>
  </foreignObject>
</svg>
